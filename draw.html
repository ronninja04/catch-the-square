<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>עולם ההגרלות</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f4f0ff, #e8f4ff);
  color: #25233a;
}
.game {
  text-align: center;
  width: min(92vw, 720px);
}
h1 {
  font-size: clamp(34px, 7vw, 58px);
  margin: 0 0 8px;
}
.sub {
  font-size: 19px;
  color: #6d6a7d;
  margin: 0 0 30px;
}
.chest {
  position: relative;
  width: min(72vw, 300px);
  height: 230px;
  margin: 20px auto 35px;
  cursor: pointer;
  user-select: none;
}
.lid {
  position: absolute;
  z-index: 3;
  left: 8%;
  top: 25px;
  width: 84%;
  height: 82px;
  border-radius: 28px 28px 14px 14px;
  background: linear-gradient(#9b6cff, #6949dc);
  box-shadow: 0 10px 18px #0002;
  transform-origin: bottom center;
  transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.lid:after {
  content: "";
  position: absolute;
  left: 43%;
  top: 18px;
  width: 14%;
  height: 45px;
  border-radius: 8px;
  background: #ffd45a;
}
.body {
  position: absolute;
  left: 5%;
  bottom: 15px;
  width: 90%;
  height: 145px;
  border-radius: 18px 18px 28px 28px;
  background: linear-gradient(#805be9, #5239bd);
  box-shadow: 0 18px 30px #0002;
}
.lock {
  position: absolute;
  z-index: 4;
  left: 43%;
  top: 83px;
  width: 14%;
  height: 65px;
  border-radius: 10px;
  background: #ffd45a;
  box-shadow: 0 4px 8px #0002;
}
.lock:before {
  content: "";
  opacity: 1;
  transition: opacity 2.5s;
  position: absolute;
  left: 25%;
  top: -25px;
  width: 50%;
  height: 35px;
  border: 8px solid #ffd45a;
  border-bottom: 0;
  border-radius: 15px 15px 0 0;
}
.chest.open .lid {
  transform: translateY(-55px) rotate(-8deg);
}
.chest.closing .lid {
  transform: translateY(0) rotate(0deg);
}
.chest.open .lock {
  opacity: 0.35;
}
.chest.closing .lock {
  opacity: 1;
}
.chest.open {
  animation: bounce 1s;
}
.chest.closing {
  animation: none;
}
.spark {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.spark span {
  position: absolute;
  opacity: 0;
  font-size: 28px;
}
.chest.open .spark span {
  animation: pop 0.7s ease-out;
}
.spark span:nth-child(1) {
  left: 8%;
  top: 25%;
  animation-delay: 0.05s;
}
.spark span:nth-child(2) {
  right: 8%;
  top: 15%;
  animation-delay: 0.12s;
}
.spark span:nth-child(3) {
  left: 18%;
  bottom: 8%;
  animation-delay: 0.18s;
}
.spark span:nth-child(4) {
  right: 18%;
  bottom: 15%;
  animation-delay: 0.25s;
}
@keyframes pop {
  0% {
    opacity: 0;
    transform: translateY(15px) scale(0.4);
  }
  40% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-45px) scale(1.1);
  }
}
@keyframes bounce {
  40% {
    transform: scale(1.06);
  }
  100% {
    transform: scale(1);
  }
}
.result {
  min-height: 95px;
  padding: 22px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 25px #30306018;
  font-size: clamp(20px, 4vw, 28px);
  font-weight: bold;
  line-height: 1.5;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.3s;
}
.result.show {
  opacity: 1;
  transform: none;
}
.result.emerge {
  animation: emerge 1s ease-out;
}
@keyframes emerge {
  0% {
    opacity: 0;
    transform: translateY(-110px) scale(0.55);
  }
  45% {
    opacity: 1;
    transform: translateY(-45px) scale(1.06);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.counter {
  margin-top: 15px;
  color: #777489;
  font-size: 14px;
}
.lock.hide-before::before {
  opacity: 0;
  transition: opacity 0.5s;
}

</style>
</head>
